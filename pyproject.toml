[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-downloader"
dynamic = ["version"]
description = "YouTube Downloader desktop app and CLI"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0",
    "pillow>=10",
    "platformdirs>=4",
]

[project.scripts]
youtube-downloader = "ytdownloader.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[tool.hatch.version]
path = "version.py"

[tool.hatch.build.targets.wheel]
packages = ["ytdownloader"]

[tool.hatch.build.targets.wheel.force-include]
"version.py" = "version.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
