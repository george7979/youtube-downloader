name: Build and Release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact-name: linux-deb
            artifact-path: "*.deb"
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: "installer/windows/youtube-downloader-*-setup.exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install Python 3.12 and dependencies
        run: uv sync --managed-python --python 3.12

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(uv run python -c "from version import __version__; print(__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary (PyInstaller)
        run: uv run pyinstaller youtube-downloader.spec --clean

      - name: Build .deb package (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fakeroot dpkg-dev
          bash installer/linux/build-deb.sh ${{ steps.version.outputs.VERSION }}

      - name: Verify .deb (Linux)
        if: runner.os == 'Linux'
        run: dpkg --info *.deb

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis --yes

      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $makensis /DAPP_VERSION=$env:APP_VERSION installer\windows\installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  test-install-linux:
    name: Test .deb on Ubuntu ${{ matrix.ubuntu }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu: ['22.04', '24.04']
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y wget

      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb

      - name: Install and verify
        run: |
          dpkg -i *.deb || true
          apt-get install -f -y
          dpkg -l | grep youtube-downloader
          test -f /usr/bin/youtube-downloader
          echo "Install OK on Ubuntu ${{ matrix.ubuntu }}"

  release:
    name: Create GitHub Release
    needs: [build, test-install-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts flat
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: YouTube Downloader v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: release-assets/**
          body: |
            ## YouTube Downloader v${{ steps.version.outputs.VERSION }}

            ### Linux (Debian/Ubuntu)
            Download the `.deb` and install it: `sudo apt install ./youtube-downloader_${{ steps.version.outputs.VERSION }}_amd64.deb`

            ### Windows
            Download `youtube-downloader-${{ steps.version.outputs.VERSION }}-setup.exe` and run the installer.

            On first run the app downloads yt-dlp and Deno (and ffmpeg on Windows, or on Linux when no system ffmpeg is installed).

            Install tested on Ubuntu 22.04 / 24.04 LTS.

            ---
            You are responsible for the legality of the content you download.
