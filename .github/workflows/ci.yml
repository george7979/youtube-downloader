name: Continuous Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install Python 3.12 and dependencies
        run: uv sync --managed-python --python 3.12

      - name: Lint (syntax errors only)
        run: >
          uv run --with flake8 flake8 ytdownloader/ tests/ launcher.py version.py
          --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -q

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -q

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for sensitive files
        run: |
          if find . -name ".env" -o -name ".env.local" | grep -q .; then
            echo "ERROR: .env files found in repository!"
            find . -name ".env" -o -name ".env.local"
            exit 1
          fi
          if find . -name "*.pem" -o -name "*.key" | grep -v ".github" | grep -q .; then
            echo "ERROR: Private key files found!"
            exit 1
          fi
          echo "Security scan passed"
